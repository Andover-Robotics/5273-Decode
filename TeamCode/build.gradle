//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.


// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'
apply plugin: "com.github.spotbugs"

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_16
        targetCompatibility JavaVersion.VERSION_16
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    maven {
        url = 'https://maven.brott.dev/'
    }
}

dependencies {
    implementation 'org.ftclib.ftclib:vision:2.1.0' // vision
    implementation 'org.ftclib.ftclib:core:2.1.1' // core
    implementation project(':FtcRobotController')
    implementation "com.acmerobotics.roadrunner:ftc:0.1.23"
    implementation "com.acmerobotics.roadrunner:core:1.0.1"
    implementation "com.acmerobotics.roadrunner:actions:1.0.1"
    implementation "com.acmerobotics.dashboard:dashboard:0.5.1"
}

import com.github.spotbugs.snom.SpotBugsTask

// Create a stable task name we can call from CI: :TeamCode:spotbugsTeamCodeDebug
afterEvaluate {
    def variants =
            (project.plugins.hasPlugin("com.android.library") && android.hasProperty("libraryVariants")) ? android.libraryVariants :
            (project.plugins.hasPlugin("com.android.application") && android.hasProperty("applicationVariants")) ? android.applicationVariants :
            null

    if (variants == null) {
        logger.lifecycle("SpotBugs: No Android variants found in :TeamCode (is it an Android module?)")
        return
    }

    variants.all { variant ->
        if (variant.name != "debug") return

        def javaCompile = variant.hasProperty("javaCompileProvider") ? variant.javaCompileProvider.get() : variant.javaCompile

        // AGP versions differ on where compiled classes live:
        def classesDir = javaCompile.hasProperty("destinationDirectory")
                ? javaCompile.destinationDirectory.asFile.get()
                : javaCompile.destinationDir

        tasks.register("spotbugsTeamCodeDebug", SpotBugsTask) {
            group = "verification"
            description = "Run SpotBugs on TeamCode (debug variant)"
            dependsOn javaCompile

            // SpotBugs inputs
            classes = files(classesDir)
            // TeamCode Java sources (variant source sets)
            sourceDirs = files(variant.sourceSets.collectMany { it.java.srcDirs })

            reports.create("html") {
                required = true
                outputLocation = file("$buildDir/reports/spotbugs/teamcode-debug.html")
            }
            reports.create("xml") {
                required = true
                outputLocation = file("$buildDir/reports/spotbugs/teamcode-debug.xml")
            }
        }

        // Make `./gradlew check` run it too (optional but handy)
        tasks.named("check").configure { dependsOn("spotbugsTeamCodeDebug") }
    }
}
