name: Format (TeamCode Java)

on:
  pull_request:
    paths:
      - "TeamCode/**/*.java"
      - ".github/workflows/**"
  push:
    branches:
      - "Quali-1"
    paths:
      - "TeamCode/**/*.java"
      - ".github/workflows/**"

concurrency:
  group: format-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  google_java_format:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # This action can either “check” or “format then show diff”.
      # We choose “format then diff” so the PR shows exactly what would change.
      - name: Run google-java-format (TeamCode)
        uses: axel-op/googlejavaformat-action@v4
        with:
          files: "TeamCode/**/*.java"
          args: "--replace"
          skip-commit: true

      - name: Fail if formatting changed (prints diff)
        run: git --no-pager diff --exit-code

